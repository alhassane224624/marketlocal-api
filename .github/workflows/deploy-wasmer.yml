name: Deploiement Wasmer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Dependances PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # Wasmer n'a pas de shell : la base Aiven est mise à jour d'ici, avant de déployer le code
      # qui en dépend. En cas d'échec, le déploiement s'arrête.
      - name: Migrations (base Aiven)
        env:
          APP_ENV: production
          CACHE_STORE: array
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ATTR_SSL_CA: ${{ github.workspace }}/certs/aiven-ca.pem
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Secrets DB_* manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          php artisan migrate --force --no-interaction

      - name: Installer Wasmer
        run: curl https://get.wasmer.io -sSfL | sh

      - name: Configuration app
        run: |
          printf 'kind: wasmer.io/App.v0\nname: marketlocal-api\nowner: alhassanediane62496\npackage: .\n' > app.yaml

      - name: Deployer
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: ~/.wasmer/bin/wasmer deploy --non-interactive